<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1">
<title>ادیتورِ بلوکی</title>
<link rel="stylesheet" href="css/block-editor.css?v=1">
<style>
  html,body{ margin:0; padding:0; height:100%; background:#0d1117; font-family:'Vazirmatn',sans-serif; overflow:hidden; }
  #app{ position:absolute; inset:0; }
  #app .be-editor{ border:0; border-radius:0; min-height:0; }
  #errBox{
    position:absolute; inset:0; z-index:5; display:none; align-items:center; justify-content:center;
    text-align:center; padding:24px; font-size:13.5px; line-height:1.9; color:#ff9c92; background:rgba(13,17,23,.94);
  }
  #toast{
    position:absolute; left:50%; bottom:16px; transform:translateX(-50%); z-index:4; display:none; max-width:92%;
    padding:8px 14px; border-radius:10px; background:#161c28; border:1px solid #2a3346; color:#e9edf5; font-size:12.5px; line-height:1.8; text-align:center;
  }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="errBox"></div>
  <div id="toast"></div>

  <script src="js/arduino/arduino-mission-blocks.js"></script>
  <script src="js/arduino/block-editor.js?v=1"></script>
  <script>
    let ed = null;
    let loaded = false;      // تا وقتی true نشده هیچ ذخیره‌ی خودکاری انجام نمی‌شود
    let initToken = 0;
    let saveT = null, toastT = null;

    // نامِ بلوک‌های قدیمیِ مأموریت ← بلوک‌های ادیتورِ جدید
    const MAP = {
      ard_pin_mode: ['pinMode'],
      ard_digital_write: ['digitalWrite'],
      ard_digital_read: ['digitalRead', 'level'],
      ard_if_pin: ['digitalRead', 'level', 'if', 'ifelse', 'compare'],
      ard_pin_state: ['digitalRead', 'level'],
      ard_analog_write: ['analogWrite'],
      ard_analog_read: ['analogRead'],
      ard_pot_led: ['analogRead', 'analogWrite', 'map'],
      ard_var_declare: ['var_set', 'var_change'],
      variables_get: ['var_get'],
      variables_set: ['var_set', 'var_change'],
      controls_if: ['if', 'ifelse'],
      controls_repeat_ext: ['repeat'],
      controls_for: ['repeat'],
      controls_whileUntil: ['while'],
      controls_flow_statements: ['break'],
      ard_wait: ['delay'],
      math_number: ['number'],
      math_arithmetic: ['arith'],
      math_modulo: ['arith'],
      math_constrain: ['constrain'],
      math_random_int: ['random'],
      ard_math_map: ['map'],
      logic_compare: ['compare'],
      logic_operation: ['logic'],
      logic_negate: ['not'],
      logic_boolean: ['bool'],
      text: ['text'],
      ard_serial_begin: ['sbegin'],
      ard_serial_print: ['sprint'],
      ard_comment: ['comment'],
      ard_raw_code: ['raw']
    };

    const $ = (id) => document.getElementById(id);
    const post = (msg) => window.parent.postMessage(Object.assign({ __ardBlocks: true }, msg), '*');
    function showError(text) { $('errBox').textContent = text; $('errBox').style.display = 'flex'; }
    function toast(text) {
      const t = $('toast');
      t.textContent = text; t.style.display = 'block';
      clearTimeout(toastT);
      toastT = setTimeout(() => { t.style.display = 'none'; }, 5000);
    }
    function allowFor(task) {
      const list = window.ARDUINO_MISSION_BLOCKS && window.ARDUINO_MISSION_BLOCKS[task];
      return list ? Array.from(new Set(list.flatMap((k) => MAP[k] || []))) : undefined;
    }
    function commitOpenFields() {
      const a = document.activeElement;
      if (a && a !== document.body && a.blur) a.blur();
    }
    function commit() {
      clearTimeout(saveT); saveT = null;
      if (!ed || !loaded) return false;
      post({ type: 'change', code: ed.getCode(), snapshot: ed.getState() });
      return true;
    }
    function onChange() {
      if (!loaded) return;
      clearTimeout(saveT);
      saveT = setTimeout(commit, 120);
    }

    function init(d) {
      const token = ++initToken;
      loaded = false;
      clearTimeout(saveT);
      $('errBox').style.display = 'none';
      if (ed) { try { ed.destroy(); } catch (e) { /* noop */ } ed = null; }
      $('app').innerHTML = '';
      ed = BlockEditor.create($('app'), { rtl: true, allow: allowFor(d.task), onChange });

      // اگر عکسِ فوریِ معتبر داریم همان بلوک‌ها را عیناً برمی‌گردانیم؛ وگرنه از رویِ متن.
      // عکسِ فوریِ قدیمیِ Blockly فرمتِ دیگری دارد و نادیده گرفته می‌شود.
      const s = d.snapshot;
      let ok = false, raw = 0;
      if (s && s.v === 1 && Array.isArray(s.tops)) {
        try { ed.setState(s); ok = true; } catch (e) { ok = false; }
      }
      if (!ok) {
        try { const r = ed.setCode(d.code || ''); ok = !!(r && r.ok); raw = r && r.raw || 0; } catch (e) { ok = false; }
      }
      if (!ok) {
        // بوم خالی می‌ماند و ذخیره‌ی خودکار روشن نمی‌شود، تا کدِ سالمِ کاربر هرگز با یک خروجیِ خالی جایگزین نشود.
        const msg = 'کد به بلوک تبدیل نشد؛ آکولادها و پرانتزها را در حالتِ متنی بررسی کن.';
        showError(msg);
        post({ type: 'error', message: msg });
        return;
      }
      post({ type: 'loaded' });
      if (raw) toast(raw + ' بخش از کد به‌صورتِ «کدِ خام» (بلوکِ زردِ ⌨️) نگه داشته شد.');
      // رویدادهای خودِ بارگذاری نباید ذخیره‌ی خودکار را راه بیندازند.
      setTimeout(() => { if (token === initToken) loaded = true; }, 200);
    }

    window.addEventListener('message', (e) => {
      if (e.source !== window.parent) return;
      const d = e.data;
      if (!d || d.__ardBlocks !== true) return;
      if (d.type === 'init') { init(d); return; }
      // صفحه‌ی اصلی پیش از جابه‌جایی به «متن»، آخرین تغییرِ ذخیره‌نشده را می‌خواهد
      if (d.type === 'flush') { commitOpenFields(); if (!commit()) post({ type: 'flushed' }); return; }
    });
    window.addEventListener('pagehide', () => { commitOpenFields(); commit(); });

    post({ type: 'ready' });
  </script>
</body>
</html>
